<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slide 3 · Algoritma yang dibahas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ───────── Token ───────── */
:root{
  --bg:#050507;
  --panel:#0a0b0f;
  --line:rgba(255,255,255,.13);
  --line2:rgba(255,255,255,.07);
  --text:#f1f2f6;
  --body:#c4c7d4;
  --mute:#80849a;
  --accent:#7db4ff;
  --accent-bright:#c4dcff;
  --amber:#ffc266;
  --sans:'Space Grotesk','Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono','Cascadia Mono',Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:var(--sans);color:var(--text)}
body{opacity:0;animation:fadein .5s ease .05s forwards}
body.leaving{animation:none;opacity:0;transition:opacity .25s ease}
@keyframes fadein{to{opacity:1}}

/* ───────── Panggung 1920×1080 ───────── */
#stage{
  position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
  background:
    radial-gradient(1100px 600px at 18% -8%,rgba(110,140,220,.13),transparent 70%),
    radial-gradient(900px 600px at 100% 100%,rgba(90,110,180,.07),transparent 70%),
    radial-gradient(rgba(255,255,255,.055) 1px,transparent 1.2px) 0 0/32px 32px,
    var(--bg);
}

/* ───────── Header ───────── */
.header{position:absolute;left:96px;right:96px;top:52px;height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line2)}
.brand{display:flex;align-items:center;gap:20px}
.brand img{height:60px;width:auto;display:block}
.brand b{display:block;font-size:28px;font-weight:600;letter-spacing:-.01em}
.brand span{display:block;font-size:19px;color:var(--mute);margin-top:2px}
.tag{font-family:var(--mono);font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.kicker{position:absolute;left:96px;top:236px}
.kicker h1{font-size:56px;line-height:1.1;font-weight:700;letter-spacing:-.03em;color:var(--text)}

/* ───────── Kolom teks ───────── */
.copy{position:absolute;left:96px;top:322px;width:740px;height:620px;display:flex;flex-direction:column;justify-content:flex-start;gap:18px}
.blk{opacity:0;transform:translateY(14px);max-height:0;overflow:hidden;margin-top:0;transition:opacity .6s ease,transform .6s ease,max-height .7s ease,margin-top .7s ease;position:relative}
.blk.show{opacity:1;transform:none;max-height:460px;margin-top:26px}
.blk.show:first-child{margin-top:0}
.blk .lbl{font-family:var(--mono);font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin-bottom:10px;display:block;transition:color .4s}
.blk p{font-size:30px;line-height:1.45;color:var(--body);font-weight:400;transition:font-size .5s ease,color .5s ease}
.blk b{color:var(--text);font-weight:600}
.blk em{font-style:italic;color:var(--text)}
.blk.active .lbl{color:var(--accent)}
.blk.active p{color:#e4e6ee}
.blk.seen{opacity:.5}
.blk.seen p{font-size:23px}
.blk .more{display:inline;opacity:0;transition:opacity .7s ease .15s}
.blk .more.show{opacity:1}

/* ───────── Panel grafik ───────── */
.panel{position:absolute;left:880px;top:236px;width:944px;height:716px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.005));}
.panel::before,.panel::after,.panel .c1,.panel .c2{content:"";position:absolute;width:16px;height:16px;border:2px solid var(--accent);opacity:.9}
.panel::before{left:-2px;top:-2px;border-right:0;border-bottom:0}
.panel::after{right:-2px;top:-2px;border-left:0;border-bottom:0}
.panel .c1{left:-2px;bottom:-2px;border-right:0;border-top:0}
.panel .c2{right:-2px;bottom:-2px;border-left:0;border-top:0}
.phead{height:76px;border-bottom:1px solid var(--line2);display:flex;align-items:center;justify-content:space-between;padding:0 28px}
.fig{font-family:var(--mono);font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.fig b{color:var(--text);font-weight:500}
.readout{text-align:right;transition:opacity .25s ease}
.readout.swap{opacity:0}
.readout small{display:block;font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.readout strong{display:block;font-family:var(--mono);font-size:32px;font-weight:500;color:var(--text);line-height:1.1;margin-top:2px;font-variant-numeric:tabular-nums}
.readout strong .u{font-size:17px;color:var(--mute);margin-left:6px}
.readout strong .ok{font-size:16px;letter-spacing:.14em;color:#06121f;background:var(--accent);padding:3px 9px;border-radius:3px;margin-left:12px;vertical-align:middle}
.readout strong .q{font-size:16px;letter-spacing:.1em;color:var(--amber);margin-left:12px}

svg#g{display:block;width:100%;height:auto;aspect-ratio:960/520;margin-top:0}
.pfoot{position:absolute;left:0;right:0;bottom:0;height:112px;border-top:1px solid var(--line2);padding:0 28px;display:flex;align-items:center}
.pf{position:absolute;left:28px;right:28px;top:50%;transform:translateY(-50%);opacity:0;transition:opacity .45s ease;pointer-events:none}
.pf.show{opacity:1}
.legend{display:flex;gap:34px;align-items:center;font-size:21px;color:var(--body)}
.legend span{display:flex;align-items:center;gap:12px}
.legend .d{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.7)}
.legend .l{width:30px;height:0;border-top:2px solid rgba(255,255,255,.5)}
.legend .n{font-family:var(--mono);font-size:15px;border:1px solid var(--line);border-radius:3px;padding:2px 8px;background:#07080b}
.cap{font-size:23px;line-height:1.45;color:var(--body)}
.cap b{color:var(--text);font-weight:600}
.cay{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}
.cay div{border:1px solid var(--line);background:#07080b;padding:7px 16px 8px;border-radius:3px}
.cay small{display:block;font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.cay strong{display:block;font-family:var(--mono);font-weight:500;font-size:24px;color:var(--amber);margin-top:2px}
.cay-note{font-size:13px;font-family:var(--mono);letter-spacing:.1em;color:var(--mute);text-transform:uppercase;margin-bottom:8px}

/* ───────── Grafik: simpul & sisi ───────── */
.edge .base{fill:none;stroke:rgba(255,255,255,.3);stroke-width:2;stroke-dasharray:1;stroke-dashoffset:0;
  transition:stroke-dashoffset .7s cubic-bezier(.3,.7,.2,1) var(--d,0ms),stroke .4s ease var(--d,0ms),opacity .4s ease var(--d,0ms)}
.edge .hot{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:0;
  transition:stroke-dashoffset .7s cubic-bezier(.3,.7,.2,1) var(--d,0ms),opacity .01s linear var(--d,0ms),stroke .35s ease var(--d,0ms),stroke-width .35s ease var(--d,0ms)}
.edge .lab rect{fill:#07080b;stroke:rgba(255,255,255,.22);stroke-width:1.3;transition:stroke .4s ease var(--d,0ms),opacity .4s ease var(--d,0ms)}
.edge .lab text{font-family:var(--mono);font-size:19px;font-weight:500;fill:var(--body);text-anchor:middle;dominant-baseline:central;transition:fill .4s ease var(--d,0ms)}
.edge .lab{transition:opacity .4s ease var(--d,0ms)}
.edge.hidden .base{stroke-dashoffset:1}
.edge.hidden .lab{opacity:0}
.edge.dim .base{stroke:rgba(255,255,255,.09)}
.edge.dim .lab{opacity:.35}
.edge.mst .hot,.edge.pick .hot,.edge.cand .hot{stroke-dashoffset:0;opacity:1}
.edge.mst .lab rect{stroke:var(--accent)} .edge.mst .lab text{fill:var(--accent)}
.edge.cand .hot{stroke:var(--amber);stroke-width:3.5}
.edge.cand .lab rect{stroke:var(--amber)} .edge.cand .lab text{fill:var(--amber)}
.edge.cand.fade .hot{opacity:.28}
.edge.cand.fade .lab{opacity:.45}
.edge.pick .hot{stroke:var(--accent-bright);stroke-width:6.5;filter:drop-shadow(0 0 7px var(--accent))}
.edge.pick .lab rect{stroke:var(--accent-bright);fill:#0e1a2c} .edge.pick .lab text{fill:var(--accent-bright)}
.edge.try .hot{stroke:var(--accent);stroke-width:4.5;stroke-dashoffset:0;opacity:.9;transition:none}
.edge.try .base{transition:none}

.node{transform-box:fill-box;transform-origin:center;transition:transform .55s cubic-bezier(.2,1.5,.4,1) var(--d,0ms),opacity .4s ease var(--d,0ms)}
.node.hidden{transform:scale(0);opacity:0}
.node .halo{fill:var(--accent);opacity:0;transition:opacity .5s ease var(--d,0ms)}
.node .dot{fill:#0a0b10;stroke:rgba(255,255,255,.6);stroke-width:2.5;transition:fill .45s ease var(--d,0ms),stroke .45s ease var(--d,0ms)}
.node text{font-family:var(--mono);font-size:21px;font-weight:500;fill:var(--text);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.node.in .halo{opacity:.2}
.node.in .dot{stroke:var(--accent);fill:#0f1c31}

#cutd{opacity:0;transition:opacity .5s ease}
#cutd.show{opacity:1}
#cutd .line{fill:none;stroke:var(--accent-bright);stroke-width:2.5;stroke-dasharray:11 9;animation:march 1.4s linear infinite}
#cutd .zone{fill:rgba(125,180,255,.07);stroke:none}
#cutd text{font-family:var(--mono);font-size:15px;letter-spacing:.18em;fill:var(--accent)}
@keyframes march{to{stroke-dashoffset:-40}}
#aman{opacity:0;transition:opacity .5s ease .5s}
#aman.show{opacity:1}
#aman rect{fill:var(--accent);rx:3}
#aman text{font-family:var(--mono);font-size:15px;font-weight:500;letter-spacing:.14em;fill:#06121f;text-anchor:middle;dominant-baseline:central}

/* ───────── Footer ───────── */
.footer{position:absolute;left:96px;right:96px;bottom:44px;height:62px;display:flex;align-items:flex-end;justify-content:space-between}
.prog{display:flex;gap:8px;width:1000px}
.seg{position:relative}
.seg .bar{height:3px;background:rgba(255,255,255,.14);position:relative;overflow:hidden}
.seg .bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent);transition:width .6s ease}
.seg span{display:block;margin-top:9px;font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#4b4e60;white-space:nowrap}
.seg.cur span{color:var(--accent)}
.ctrl{display:flex;align-items:center;gap:12px}
.cnt{font-family:var(--mono);font-size:17px;letter-spacing:.12em;color:var(--mute);margin-right:10px;min-width:70px;text-align:right}
.btn{font-family:var(--mono);font-size:17px;letter-spacing:.1em;text-transform:uppercase;color:var(--text);background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:3px;height:50px;padding:0 22px;cursor:pointer;transition:background .2s,border-color .2s,color .2s}
.btn:hover:not(:disabled){background:rgba(125,180,255,.12);border-color:var(--accent);color:var(--accent-bright)}
.btn.pri{border-color:rgba(125,180,255,.55);background:rgba(125,180,255,.1)}
.btn:disabled{opacity:.3;cursor:default}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{position:absolute;right:96px;bottom:12px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:#4b4e60;text-transform:uppercase}

/* ───────── Dock navigasi (pop up, muncul saat kursor di bawah) ───────── */
.prog{width:100%}
#dock{position:absolute;left:50%;bottom:78px;transform:translate(-50%,28px);opacity:0;pointer-events:none;z-index:10;
  display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 16px 9px;
  background:#0a0b0f;border:1px solid rgba(255,255,255,.2);border-radius:6px;box-shadow:0 18px 50px rgba(0,0,0,.6);
  transition:opacity .35s ease,transform .35s ease}
#dock.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#dock .hint{position:static}

#dock .btn{font-size:14px;height:36px;padding:0 16px;letter-spacing:.08em}
#dock .cnt{font-size:14px;min-width:54px;margin-right:6px}
#dock .ctrl{gap:8px}
#dock .hint{font-size:11px}
.edge-hint{position:fixed;top:0;bottom:0;width:7vw;pointer-events:none;opacity:0;transition:opacity .25s ease;z-index:5}
.edge-hint.l{left:0;background:linear-gradient(90deg,rgba(125,180,255,.14),transparent)}
.edge-hint.r{right:0;background:linear-gradient(270deg,rgba(125,180,255,.14),transparent)}
.edge-hint.on{opacity:1}


/* ───────── Slide 3: tiga kartu ───────── */
.kicker{top:158px}
.fam-t{position:absolute;left:96px;top:244px;font-size:34px;color:var(--body);display:flex;gap:18px;align-items:baseline}
.fam-t b{color:var(--text);font-weight:600}.fam-t em{font-style:italic;color:var(--text)}
.fam-t small{font-family:var(--mono);font-size:14px;letter-spacing:.18em;color:var(--mute);text-transform:uppercase}
#strip{position:absolute;left:96px;top:292px;width:1728px;height:130px;overflow:visible}
.gd{fill:#0a0b10;stroke:rgba(255,255,255,.3);stroke-width:2;transform-box:fill-box;transform-origin:center;transform:scale(0);opacity:0;
  transition:transform .8s cubic-bezier(.2,1.7,.4,1) var(--ed,0ms),opacity .5s ease var(--ed,0ms)}
#strip.in .gd{transform:none;opacity:1;animation:tw 4s ease-in-out 1.8s infinite;animation-delay:calc(1.8s + var(--td,0s))}
@keyframes tw{0%,100%{stroke:rgba(255,255,255,.3)}50%{stroke:rgba(125,180,255,.85);fill:#10192b}}
.gdw{animation:fl 7s ease-in-out infinite alternate;animation-delay:var(--fd,0s)}
@keyframes fl{from{transform:translate(0,0)}to{transform:translate(var(--fx,10px),var(--fy,-10px))}}
.gl{stroke:rgba(125,180,255,.14);stroke-width:1.5;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1s ease var(--ld,0ms)}
#strip.in .gl{stroke-dashoffset:0}
.pls{fill:var(--accent-bright);opacity:0;filter:drop-shadow(0 0 5px var(--accent))}

.pin{fill:#0a0b10;stroke:rgba(255,255,255,.3);stroke-width:2.5;transition:all .5s ease}
.pin.on{fill:var(--c);stroke:var(--c);filter:drop-shadow(0 0 10px var(--c))}
.beam{stroke:var(--c);stroke-width:3;stroke-dasharray:1;stroke-dashoffset:1;opacity:0;transition:stroke-dashoffset .7s ease,opacity .01s}
.beam.on{stroke-dashoffset:0;opacity:1}
.cards{position:absolute;left:96px;top:430px;width:1728px;height:520px;display:grid;grid-template-columns:repeat(3,1fr);gap:36px}
.card{--c:var(--accent);position:relative;border:1px solid var(--line);background:linear-gradient(180deg,rgba(125,180,255,.07),rgba(255,255,255,.01) 55%);border-radius:6px;padding:26px 30px 22px;
  opacity:0;transform:translateY(46px) scale(.97);transition:opacity .7s ease,transform .8s cubic-bezier(.2,.9,.2,1),border-color .5s,box-shadow .5s}
.card.amb{--c:var(--amber);background:linear-gradient(180deg,rgba(255,194,102,.08),rgba(255,255,255,.01) 55%)}
.card.show{opacity:1;transform:none;border-color:color-mix(in srgb,var(--c) 55%,transparent);box-shadow:0 0 50px color-mix(in srgb,var(--c) 14%,transparent)}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--c);transform:scaleX(0);transform-origin:left;transition:transform 1s ease .3s}
.card.show::before{transform:scaleX(1)}
.ch{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:15px;letter-spacing:.18em;color:var(--mute)}
.ch .tg{color:var(--c)}
.card h2{font-size:56px;font-weight:700;letter-spacing:-.03em;margin:8px 0 0;color:var(--text);line-height:1.1}
.card svg{display:block;width:100%;height:auto;margin-top:6px}
.card .cc{position:absolute;left:30px;right:30px;bottom:18px;font-size:23px;color:var(--body);border-top:1px solid var(--line2);padding-top:14px}
.card .cc b{color:var(--c);font-weight:600}
.me .base{fill:none;stroke:rgba(255,255,255,.26);stroke-width:3}
.me .hot{fill:none;stroke:var(--c);stroke-width:7;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:0;transition:stroke-dashoffset .6s cubic-bezier(.3,.7,.2,1),opacity .01s}
.me.mst .hot,.me.pick .hot{stroke-dashoffset:0;opacity:1}
.me.pick .hot{filter:drop-shadow(0 0 8px var(--c))}
.me.try .hot{stroke:#fff;stroke-width:6;stroke-dashoffset:0;opacity:.9;transition:none}
.me.cand .hot{stroke:var(--amber);stroke-width:6;stroke-dashoffset:0;opacity:.95;filter:drop-shadow(0 0 7px rgba(255,194,102,.6));transition:stroke-dashoffset .6s ease}
.me.cand .lab rect{stroke:var(--amber);fill:#2a2110}.me.cand .lab text{fill:var(--amber)}
.me.rej .hot{stroke:var(--amber);stroke-width:6;stroke-dashoffset:0;opacity:0;transition:opacity .6s ease}
.me.pick .hot{stroke:#fff;stroke-width:9;filter:drop-shadow(0 0 12px var(--c))}
.me.pick .lab rect{stroke:#fff;fill:#16233b}.me.pick .lab text{fill:#fff}
.me.dim .base{stroke:rgba(255,255,255,.08)}
.me.hidden{opacity:0}.me{transition:opacity .4s ease}
.me .lab rect{fill:#07080b;stroke:rgba(255,255,255,.22);stroke-width:1.5}
.me .lab text{font-family:var(--mono);font-size:26px;fill:var(--body);text-anchor:middle;dominant-baseline:central}
.me.mst .lab rect,.me.pick .lab rect{stroke:var(--c)}.me.mst .lab text,.me.pick .lab text{fill:var(--c)}
.mn{transition:opacity .4s ease}.mn.hidden{opacity:0}
.mn .halo{fill:var(--c);opacity:0;transition:opacity .5s}.mn.in .halo{opacity:.22}
.mn .dot{fill:#0a0b10;stroke:rgba(255,255,255,.6);stroke-width:3;transition:stroke .4s,fill .4s}
.mn.in .dot{stroke:var(--c);fill:#0f1624}
.mn text{font-family:var(--mono);font-size:28px;fill:var(--text);text-anchor:middle;dominant-baseline:central}
</style>
</head>
<body>
<div class="edge-hint l" id="eh-l"></div><div class="edge-hint r" id="eh-r"></div>
<div id="stage">
  <div class="header">
    <div class="brand"><img src="aset/logo-unhas.png" alt="Logo Universitas Hasanuddin">
      <div><b>Universitas Hasanuddin</b><span>Magister Teknik Informatika</span></div></div>
    <div class="tag">Tugas Besar Analisis Algoritma</div>
  </div>
  <div class="kicker"><h1>Algoritma yang dibahas</h1></div>
  <div class="fam-t"><span><b>Algoritma <em>greedy</em></b> ada banyak jenisnya</span><small>dan banyak lainnya</small></div>
  <svg id="strip" viewBox="0 0 1728 130" aria-hidden="true"></svg>
  <div class="cards" id="cards"></div>
  <div class="footer"><div class="prog" id="prog"></div></div>
  <div id="dock"><div class="ctrl">
      <span class="cnt" id="cnt"></span>
      <button class="btn" id="prev">Sebelumnya</button><button class="btn" id="reset">Reset</button><button class="btn pri" id="next">Berikutnya</button>
    </div><div class="hint">← → navigasi · R reset · F layar penuh · I indeks</div></div>
</div>
<script>
const $=s=>document.querySelector(s);
const PREV_SLIDE='slide2.html', NEXT_SLIDE='slide4.html', SLIDE_NO=3;
const NS='http://www.w3.org/2000/svg';
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};
let runs=[];const later=(f,ms)=>runs.push(setTimeout(f,ms));const clearRuns=()=>{runs.forEach(clearTimeout);runs=[];};

/* strip keluarga: titik melayang + tiga titik terpilih */
const strip=$('#strip'), CX=[288,864,1440], CC=['var(--accent)','var(--accent)','var(--amber)'];
const pts=[];
for(let i=0;i<46;i++){const x=20+i*37.5+((i*53)%17), y=22+((i*37)%70);pts.push([x,y]);}
const LN=[];
pts.forEach(([x,y],i)=>{ if(i&&Math.abs(pts[i-1][0]-x)<60) LN.push([pts[i-1],[x,y],i]);
  if(i>3&&(i*7)%5===0) LN.push([pts[i-4],[x,y],i]);});
LN.forEach(([a,b,i])=>{const l=el('line',{class:'gl',x1:a[0],y1:a[1],x2:b[0],y2:b[1],pathLength:1},strip);l.style.setProperty('--ld',(300+i*30)+'ms');});
pts.forEach(([x,y],i)=>{const w=el('g',{transform:'translate('+x+','+y+')'},strip);const n=el('g',{class:'gdw'},w);
  n.style.setProperty('--fd',(-i*.7)+'s');n.style.setProperty('--fx',((i%3)*6-6)+'px');n.style.setProperty('--fy',((i%4)*5-8)+'px');
  const c=el('circle',{class:'gd',r:5+(i%3)*2},n);c.style.setProperty('--ed',(i*35)+'ms');c.style.setProperty('--td',((i*0.37)%4)+'s');});
LN.filter((_,k)=>k%4===0).forEach(([a,b],k)=>{const p=el('circle',{class:'pls',r:3.5},strip);
  const bg=(1.5+k*.35)+'s';el('animateMotion',{dur:(2.6+(k%4)*.7)+'s',repeatCount:'indefinite',begin:bg,path:'M'+a[0]+' '+a[1]+' L'+b[0]+' '+b[1]},p);
  el('animate',{attributeName:'opacity',from:0,to:.9,dur:'.05s',begin:bg,fill:'freeze'},p);});
function intro(){strip.classList.remove('in');void strip.getBoundingClientRect();strip.classList.add('in');}
const pins=[],beams=[];
CX.forEach((x,i)=>{const c=CC[i];
  const b=el('path',{class:'beam',d:'M'+x+' 60 L'+x+' 130',pathLength:1},strip);b.style.setProperty('--c',c);beams.push(b);
  const p=el('circle',{class:'pin',cx:x,cy:60,r:13},strip);p.style.setProperty('--c',c);pins.push(p);});

/* kartu */
const NODES=[['A',70,230],['B',270,80],['C',270,380],['D',490,230],['E',690,230]];
const EDGES=[[0,1,5],[0,2,8],[1,2,11],[1,3,3],[2,3,6],[3,4,4],[2,4,9]];
const DEF=[{n:'Kruskal',tag:'UTAMA',cc:'<b>Urut sisi</b> dari termurah',amb:false},
           {n:'Prim',tag:'UTAMA',cc:'<b>Tumbuh</b> dari satu titik',amb:false},
           {n:'Borůvka',tag:'PEMBANDING',cc:'<b>Serentak</b>, semua titik memilih',amb:true}];
const G=[];
DEF.forEach((d,i)=>{
  const c=document.createElement('div');c.className='card'+(d.amb?' amb':'');
  c.innerHTML='<div class="ch"><span>0'+(i+1)+'</span><span class="tg">'+d.tag+'</span></div><h2>'+d.n+'</h2>';
  const svg=el('svg',{viewBox:'0 0 760 460'});c.appendChild(svg);
  const cc=document.createElement('div');cc.className='cc';cc.innerHTML=d.cc;c.appendChild(cc);
  $('#cards').appendChild(c);
  const EL=[],NL=[];
  EDGES.forEach(([a,b,w])=>{const A=NODES[a],B=NODES[b],e=el('g',{class:'me hidden'},svg),dd='M'+A[1]+' '+A[2]+' L'+B[1]+' '+B[2];
    el('path',{class:'base',d:dd},e);el('path',{class:'hot',d:dd,pathLength:1},e);
    const l=el('g',{class:'lab',transform:'translate('+(A[1]+B[1])/2+','+(A[2]+B[2])/2+')'},e);
    el('rect',{x:-24,y:-19,width:48,height:38,rx:4},l);el('text',{},l).textContent=w;EL.push(e);});
  NODES.forEach(([n,x,y])=>{const o=el('g',{transform:'translate('+x+','+y+')'},svg),nd=el('g',{class:'mn hidden'},o);
    el('circle',{class:'halo',r:54},nd);el('circle',{class:'dot',r:34},nd);el('text',{},nd).textContent=n;NL.push(nd);});
  const sE=(k,s)=>EL[k].setAttribute('class','me '+s), sN=(k,s)=>NL[k].setAttribute('class','mn '+s);
  G.push({card:c,sE,sN,hide(){EL.forEach((_,k)=>sE(k,'hidden'));NL.forEach((_,k)=>sN(k,'hidden'));},
    base(){EL.forEach((_,k)=>sE(k,''));NL.forEach((_,k)=>sN(k,''));}});
});
function loopK(){const g=G[0];g.base();let t=1200;
  [[3,1],[5,1],[0,1],[4,1],[1,0],[6,0],[2,0]].forEach(([e,ok])=>{later(()=>g.sE(e,'try'),t);later(()=>g.sE(e,ok?'mst':'dim'),t+600);t+=800;});
  [0,1,2,3,4].forEach(k=>later(()=>g.sN(k,'in'),1800+k*450));
  later(()=>{g.hide();later(loopK,700);},t+2000);}
function loopP(){const g=G[1];g.base();g.sN(0,'in');let t=1100;
  /* [titik asal, kandidat (sisi yang menyeberang), sisi terpilih, titik baru] */
  [[[0,1],[0,1],1],[[1,2,3],[3,0,1],3],[[3,5,4,1],[5,4,1,2],5],[[4,5,6,1],[4,5,6,1],4]];
  const R=[{c:[0,1],p:0,n:1},{c:[1,2,3],p:3,n:3},{c:[1,2,4,5],p:5,n:4},{c:[1,2,4,6],p:4,n:2}];
  R.forEach(r=>{
    later(()=>r.c.forEach(e=>g.sE(e,'cand')),t);
    later(()=>r.c.forEach(e=>{ if(e!==r.p) g.sE(e,'rej'); else g.sE(e,'pick'); }),t+1300);
    later(()=>{g.sE(r.p,'mst');g.sN(r.n,'in');r.c.forEach(e=>{if(e!==r.p)g.sE(e,'');});},t+2300);
    t+=2900;});
  later(()=>{g.hide();later(loopP,700);},t+1800);}
function loopB(){const g=G[2];g.base();[0,1,2,3,4].forEach(k=>g.sN(k,'in'));
  later(()=>[3,0,4,5].forEach(e=>g.sE(e,'cand')),1400);
  later(()=>[3,0,4,5].forEach(e=>g.sE(e,'mst')),2800);
  later(()=>{g.hide();later(loopB,700);},6200);}
const LOOPS=[loopK,loopP,loopB];

function show(n){ /* n kartu tampil */
  G.forEach((g,i)=>{g.card.classList.toggle('show',i<n);pins[i].classList.toggle('on',i<n);beams[i].classList.toggle('on',i<n);});
}
const STEPS=[()=>{clearRuns();G.forEach(g=>g.hide());show(0);},
  ()=>{clearRuns();G.forEach(g=>g.hide());show(1);later(LOOPS[0],900);},
  ()=>{clearRuns();G.forEach(g=>g.hide());show(2);later(LOOPS[0],300);later(LOOPS[1],900);},
  ()=>{clearRuns();G.forEach(g=>g.hide());show(3);later(LOOPS[0],300);later(LOOPS[1],500);later(LOOPS[2],900);}];
const LAST=STEPS.length-1;let step=0;

const GROUPS=[['Pembuka',1],['Konsep',1],['Algoritma',4],['Teori',1],['Eksperimen',3],['Penutup',1]];
(function(){const p=$('#prog');GROUPS.forEach(([n,c])=>{const s=document.createElement('div');s.className='seg';s.style.flex=c;s.innerHTML='<div class="bar"><i></i></div><span>'+n+'</span>';p.appendChild(s);});})();
function progress(){let start=0;document.querySelectorAll('.seg').forEach((s,gi)=>{const c=GROUPS[gi][1];let done=0;
  if(SLIDE_NO>start+c)done=c;else if(SLIDE_NO>start)done=(SLIDE_NO-1-start)+(step+1)/(LAST+1);
  s.querySelector('i').style.width=(done/c*100)+'%';s.classList.toggle('cur',SLIDE_NO>start&&SLIDE_NO<=start+c);start+=c;});}
function render(){STEPS[step]();progress();$('#cnt').textContent=(step+1)+' / '+(LAST+1);
  $('#prev').textContent=step===0?'Slide 2':'Sebelumnya';const nx=$('#next');
  if(step<LAST){nx.disabled=false;nx.textContent='Berikutnya';}
  else if(NEXT_SLIDE){nx.disabled=false;nx.textContent='Slide 4';}else{nx.disabled=true;nx.textContent='Slide 4 menyusul';}}
function leave(u){document.body.classList.add('leaving');setTimeout(()=>{location.href=u;},260);}
function next(){if(step<LAST){step++;render();}else if(NEXT_SLIDE)leave(NEXT_SLIDE);}
function prev(){if(step>0){step--;render();}else if(PREV_SLIDE)leave(PREV_SLIDE);}
function reset(){clearRuns();step=0;G.forEach(g=>g.hide());show(0);intro();setTimeout(render,300);}
$('#next').onclick=next;$('#prev').onclick=prev;$('#reset').onclick=reset;
addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key;
  if(k==='ArrowRight'||k===' '||k==='PageDown'||k==='Enter'){e.preventDefault();next();}
  else if(k==='ArrowLeft'||k==='PageUp'||k==='Backspace'){e.preventDefault();prev();}
  else if(k==='r'||k==='R')reset();
  else if(k==='f'||k==='F'){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();}
  else if(k==='i'||k==='I')leave('index.html');});
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080),st=$('#stage');
  st.style.transform='translate('+((innerWidth-1920*s)/2)+'px,'+((innerHeight-1080*s)/2)+'px) scale('+s+')';}
addEventListener('resize',fit);fit();
G.forEach(g=>g.hide());
setTimeout(intro,200);
const q=new URLSearchParams(location.search).get('step');
if(q!==null){step=Math.max(0,Math.min(LAST,+q||0));render();}else setTimeout(render,500);

/* ═════════ Dock: muncul saat kursor di bawah, hilang 2 detik setelah dilepas ═════════ */
(function(){
  const dock=document.getElementById('dock'); let t=null, armed=false;
  const show=()=>{dock.classList.add('show');clearTimeout(t);armed=false;};
  const arm=()=>{ if(armed||!dock.classList.contains('show'))return; armed=true; t=setTimeout(()=>{dock.classList.remove('show');armed=false;},1000); };
  addEventListener('mousemove',e=>{ if(e.clientY>innerHeight*0.85||dock.matches(':hover')) show(); else arm(); });
  document.addEventListener('mouseleave',arm);
})();
const EDGE_PREV=()=>prev(), EDGE_NEXT=()=>next();

/* ═════════ Zona tepi layar ala Canva: kiri jauh = mundur, kanan jauh = maju ═════════ */
(function(){
  const EDGE=0.07, mkCur=d=>'url("data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'44\' height=\'44\'><circle cx=\'22\' cy=\'22\' r=\'20\' fill=\'%230a0b0f\' stroke=\'%237db4ff\' stroke-width=\'2\'/><path d=\''+d+'\' fill=\'none\' stroke=\'%23c4dcff\' stroke-width=\'3.2\' stroke-linecap=\'round\' stroke-linejoin=\'round\'/></svg>") 22 22, pointer';
  const CL=mkCur('M25 13l-9 9 9 9'), CR=mkCur('M19 13l9 9-9 9');
  const zoneOf=x=>{const r=x/innerWidth; const z=r<EDGE?-1:(r>1-EDGE?1:0); return (z===-1&&!EDGE_PREV)?0:z;};
  const L=document.getElementById('eh-l'), R=document.getElementById('eh-r');
  addEventListener('mousemove',e=>{ const z=zoneOf(e.clientX);
    document.documentElement.style.cursor = z<0?CL:(z>0?CR:'');
    L.classList.toggle('on',z<0); R.classList.toggle('on',z>0); });
  document.addEventListener('mouseleave',()=>{L.classList.remove('on');R.classList.remove('on');document.documentElement.style.cursor='';});
  addEventListener('click',e=>{ if(e.target.closest('#dock'))return; const z=zoneOf(e.clientX); if(z<0)EDGE_PREV(); else if(z>0)EDGE_NEXT(); });
})();
</script>
</body>
